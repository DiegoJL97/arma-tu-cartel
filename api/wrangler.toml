name = "arma-tu-cartel-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# Enlace a la base de datos D1. El database_id lo devuelve
#   wrangler d1 create arma-tu-cartel
# y hay que pegarlo aqui antes del primer deploy.
[[d1_databases]]
binding = "DB"
database_name = "arma-tu-cartel"
database_id = "cbda8d1b-ac94-41f4-9e89-6226fc3180de"

[vars]
# Origenes autorizados a llamar la API. armatucartel.com es el dominio
# propio en produccion; arma-tu-cartel.pages.dev queda activo en paralelo
# como respaldo. '*' dejaria pasar a cualquiera (no usar salvo para depurar).
ALLOW_ORIGINS = "http://localhost:8000,https://arma-tu-cartel.pages.dev,https://armatucartel.com"

# IP_SALT no va aqui: es un secreto.
#   wrangler secret put IP_SALT
